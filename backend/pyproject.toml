[project]
name = "netsentinel-backend"
version = "1.0.0"
description = "NetSentinel: analista de logs de firewall/IDS para PYMEs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "reportlab>=4.2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "matplotlib>=3.9",
  "scikit-learn>=1.8",
  "optuna>=4.0",
  "shap>=0.46",
  "xgboost-cpu>=2.1",
  "joblib>=1.4",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "psutil>=5.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["pg: requiere PostgreSQL real (variable TEST_PG_URL)"]

[tool.setuptools]
packages = []
