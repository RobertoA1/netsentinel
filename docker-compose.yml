# NetSentinel - Caso 26: analista de logs de firewall/IDS para PYMEs
# Todos los secretos provienen de .env (genérelo con `make init`).

x-n8n-env: &n8n-env
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Ejecute make init para generar .env}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Lima}
  TZ: ${GENERIC_TIMEZONE:-America/Lima}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"

services:
  # ---------------------------------------------------------------- PostgreSQL
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netsentinel}
      POSTGRES_USER: ${POSTGRES_USER:-netsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecute make init para generar .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ------------------------------------------------------------------- Backend
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Ejecute make init para generar .env}
      JWT_SECRET: ${JWT_SECRET:?Ejecute make init para generar .env}
      N8N_API_KEY: ${N8N_API_KEY:?Ejecute make init para generar .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Ejecute make init para generar .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@netsentinel.local}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      INGEST_DIR: ${INGEST_DIR:-/data/ingest}
      DATASET_DIR: ${DATASET_DIR:-/data/dataset}
      REPORTS_DIR: ${REPORTS_DIR:-/data/reports}
      ML_DIR: ${ML_DIR:-/data/ml}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./data/ingest:/data/ingest
      - ./data/dataset:/data/dataset
      - reports:/data/reports
      - ml_data:/data/ml
    ports:
      - "8000:8000"

  # ------------------------------------------------- Worker del Laboratorio ML
  # Misma imagen que el backend, distinto comando: consume la cola `ml_jobs` y lanza los scripts
  # `python -m app.ml.scripts.{train,evaluate,explain,optimize} --job-id N` como subprocesos.
  ml-worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
    # Espera a que el backend aplique la migración 0002 (tabla ml_jobs) antes de consumir la cola.
    command:
      - sh
      - -c
      - |
        python -m app.db.wait
        until python -c "from sqlalchemy import inspect; from app.db.session import get_engine; raise SystemExit(0 if inspect(get_engine()).has_table('ml_jobs') else 1)"; do echo "Esperando migración 0002..."; sleep 3; done
        exec python -m app.ml.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?Ejecute make init para generar .env}
      JWT_SECRET: ${JWT_SECRET:?Ejecute make init para generar .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Ejecute make init para generar .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      INGEST_DIR: ${INGEST_DIR:-/data/ingest}
      DATASET_DIR: ${DATASET_DIR:-/data/dataset}
      ML_DIR: ${ML_DIR:-/data/ml}
      ML_N_JOBS: ${ML_N_JOBS:-4}
    volumes:
      - ./data/ingest:/data/ingest
      - ./data/dataset:/data/dataset
      - ml_data:/data/ml

  # ------------------------------------------------------------------ Frontend
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  # ----------------------------------------------------------------------- n8n
  # Versión fijada (rama estable 2.x). Cámbiela de forma deliberada, no con `latest`.
  n8n:
    image: n8nio/n8n:2.47.4
    restart: unless-stopped
    depends_on:
      n8n-import:
        condition: service_completed_successfully
    environment:
      <<: *n8n-env
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      # Acceso por http (sin TLS): sin esto el navegador rechaza la cookie de sesión fuera de localhost.
      N8N_SECURE_COOKIE: "false"
      # n8n 2.x bloquea $env en nodos por defecto; los workflows leen estas variables con $env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Variables usadas por los workflows (expresiones $env.*)
      NETSENTINEL_API_URL: http://backend:8000/api/v1
      N8N_API_KEY: ${N8N_API_KEY:?Ejecute make init para generar .env}
      NETSENTINEL_SMTP_ENABLED: ${NETSENTINEL_SMTP_ENABLED:-false}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Importa y activa los workflows de ./n8n/workflows una sola vez (idempotente) antes de arrancar n8n.
  n8n-import:
    image: n8nio/n8n:2.47.4
    restart: "no"
    entrypoint: ["/bin/sh", "/import-workflows.sh"]
    environment:
      <<: *n8n-env
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/import-workflows.sh:/import-workflows.sh:ro

  # -------------------------------------------------------------------- Ollama
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    # GPU NVIDIA (opcional): requiere nvidia-container-toolkit. Descomente para usarla.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Servicio de un solo uso: descarga el modelo (~2 GB para llama3.2:3b) cuando Ollama está listo.
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do echo "Esperando a Ollama..."; sleep 2; done
        echo "Descargando modelo $${OLLAMA_MODEL} ..."
        ollama pull "$${OLLAMA_MODEL}"
        echo "Modelo $${OLLAMA_MODEL} listo."

volumes:
  pgdata:
  reports:
  n8n_data:
  ollama_data:
  ml_data:
